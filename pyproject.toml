[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nudge"
version = "0.1.0"
description = "Natural dynamics control of gene regulatory networks"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "sympy",
    "pyyaml",
    "networkx",
    "matplotlib",
    "colomoto-jupyter",
    "algorecell_types",
]

[project.optional-dependencies]
gpu = ["cupy"]
pyeda = ["pyeda"]

[tool.setuptools.packages.find]
where = ["src"]
